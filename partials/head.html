<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{enUrl}}">
<link rel="alternate" hreflang="ar" href="{{arUrl}}">
<link rel="alternate" hreflang="x-default" href="{{enUrl}}">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="images/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:locale:alternate" content="{{ogAlt}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{site}}images/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<meta name="twitter:image" content="{{site}}images/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{fonts}}" rel="stylesheet">
{{specimens}}<link rel="stylesheet" href="styles.css">
<noscript><style>.reveal,.reveal-stagger>*{opacity:1!important;transform:none!important}</style></noscript>
<script>try{if(localStorage.getItem('ag-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
